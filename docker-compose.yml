version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "5000:5000"
    environment:
      - PYTHONIOENCODING=utf-8
      # Default to production so the API fails to start (fail-fast) instead of
      # silently running WITHOUT authentication. Set PHISHGUARD_ENV=development
      # explicitly for local dev without keys.
      - PHISHGUARD_ENV=${PHISHGUARD_ENV:-production}
      - PHISHGUARD_API_KEYS=${PHISHGUARD_API_KEYS:-}
      - PHISHGUARD_ALLOWED_ORIGINS=${PHISHGUARD_ALLOWED_ORIGINS:-http://localhost:3000}
      - PHISHGUARD_MAX_JSON_BYTES=${PHISHGUARD_MAX_JSON_BYTES:-2097152}
      - PHISHGUARD_MAX_HTML_BYTES=${PHISHGUARD_MAX_HTML_BYTES:-2097152}
      - PHISHGUARD_RATE_MIN=${PHISHGUARD_RATE_MIN:-60}
      - PHISHGUARD_RATE_HOUR=${PHISHGUARD_RATE_HOUR:-600}
      - PHISHGUARD_WEBHOOK_ALLOWLIST=${PHISHGUARD_WEBHOOK_ALLOWLIST:-}
      - PHISHGUARD_WEBHOOK_SECRET=${PHISHGUARD_WEBHOOK_SECRET:-}
      - PHISHGUARD_WEBHOOK_TIMEOUT=${PHISHGUARD_WEBHOOK_TIMEOUT:-10}
      - PHISHGUARD_WEBHOOK_RETRIES=${PHISHGUARD_WEBHOOK_RETRIES:-3}
    volumes:
      - ./data/models:/app/data/models
      - ./data/processed:/app/data/processed
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped
